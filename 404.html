<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seite nicht gefunden — Atlas Umzüge</title>
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --burgundy: #A00018;
    --bg: #FFFFFF;
    --ink: #1F1A12;
    --ink-soft: #3A3127;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  .logo { width: 120px; margin-bottom: 3rem; }
  .code {
    font-size: clamp(5rem, 15vw, 10rem);
    font-weight: 700;
    color: var(--burgundy);
    line-height: 1;
    letter-spacing: -0.04em;
  }
  h1 {
    font-size: clamp(1.25rem, 3vw, 1.75rem);
    font-weight: 600;
    margin: 1rem 0 0.5rem;
  }
  p {
    color: var(--ink-soft);
    font-size: 1rem;
    max-width: 400px;
    line-height: 1.6;
    margin-bottom: 2.5rem;
  }
  a.btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--burgundy);
    color: #fff;
    text-decoration: none;
    padding: 0.875rem 2rem;
    border-radius: 4px;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    transition: opacity 0.2s;
  }
  a.btn:hover { opacity: 0.85; }
</style>
</head>
<body>
  <img src="Logo/Web/Logo/Full%20Color/Web/atlas-logo-full-color-rgb.svg" alt="Atlas Umzüge" class="logo">
  <div class="code">404</div>
  <h1>Seite nicht gefunden</h1>
  <p>Die gesuchte Seite existiert nicht oder wurde verschoben.</p>
  <a href="/" class="btn">
    Zur Startseite
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>
</body>
</html>
