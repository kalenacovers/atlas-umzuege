<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seite nicht gefunden — Atlas Umzüge</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#A00018">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  .logo { width: 120px; margin-bottom: 3rem; }
  .code {
    font-size: clamp(5rem, 15vw, 10rem);
    font-weight: 700;
    color: var(--burgundy);
    line-height: 1;
    letter-spacing: -0.04em;
  }
  h1 {
    font-size: clamp(1.25rem, 3vw, 1.75rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 1rem 0 0.5rem;
  }
  p {
    color: var(--ink-soft);
    font-size: 1rem;
    max-width: 400px;
    line-height: 1.6;
    margin-bottom: 2.5rem;
  }
  a.btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--burgundy);
    color: #fff;
    text-decoration: none;
    padding: 0.95rem 2rem;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    box-shadow: 0 16px 34px -18px rgba(160, 0, 24, 0.58);
    transition: transform 0.3s cubic-bezier(0.22,0.61,0.36,1), background 0.3s cubic-bezier(0.22,0.61,0.36,1);
  }
  a.btn:hover { transform: translateY(-2px); background: #7A0012; }
  a.btn:active { transform: translateY(0) scale(0.98); }
</style>
</head>
<body>
  <img src="Logo/Web/Logo/White/Web/atlas-logo-white-rgb.svg" alt="Atlas Umzüge" class="logo">
  <div class="code">404</div>
  <h1>Seite nicht gefunden</h1>
  <p>Die gesuchte Seite existiert nicht oder wurde verschoben.</p>
  <a href="/" class="btn">
    Zur Startseite
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>
</body>
</html>
